<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RANKING APP</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23000000'/%3E%3Cpath d='M50 450 L150 250 L250 350 L450 50' stroke='%2339ff14' stroke-width='40' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" type="image/svg+xml">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23000000'/%3E%3Cpath d='M50 450 L150 250 L250 350 L450 50' stroke='%2339ff14' stroke-width='40' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg: #000000;
            --green: #39ff14;
            --blue: #00ffff;
            --red: #ff073a;
            --gold: #ffd700;
            --panel: #0a0a0a;
        }

        body { 
            background: var(--bg); 
            color: var(--green); 
            font-family: 'Montserrat', sans-serif; 
            font-weight: 900; 
            margin: 0; padding: 15px; 
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
        }

        /* CORES SÓLIDAS (SEM NEON/GLOW) */
        .text-green { color: var(--green); }
        .text-blue { color: var(--blue); }
        .text-red { color: var(--red); }
        .text-gold { color: var(--gold); }
        .text-white { color: #fff; }

        /* TELA START */
        #overlay-start { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 9999; 
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; 
        }
        #btn-start { 
            padding: 30px 60px; font-size: 3rem; 
            background: transparent; color: var(--green);
            border: 4px solid var(--green); 
            font-family: 'Montserrat', sans-serif; font-weight: 900;
            border-radius: 50px; 
            cursor: pointer; animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.05);} 100% {transform: scale(1);} }

        /* TELA VITÓRIA */
        #overlay-vitoria { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 10000; 
            flex-direction: column; align-items: center; justify-content: center; text-align: center; 
        }
        .nome-loja-vitoria { 
            font-size: 9rem; font-weight: 900; color: var(--gold); text-transform: uppercase; 
            border: 10px solid var(--gold); padding: 40px; border-radius: 40px; 
            background: #000;
            margin-top: 30px; max-width: 95%; line-height: 0.9;
        }

        /* HEADER */
        .metas-header { 
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; 
            margin-bottom: 15px; padding-bottom: 15px; 
            border-bottom: 4px solid var(--blue); flex-shrink: 0; 
        }
        .meta-card { 
            background: #111; padding: 10px; border: 2px solid #333; 
            text-align: center; display: flex; flex-direction: column; justify-content: center; 
            min-height: 110px; border-radius: 15px;
        }
        .meta-card h3 { margin: 0; font-size: 0.9rem; color: var(--blue); text-transform: uppercase; letter-spacing: 1px; }
        .meta-card .valor { font-size: 2.5rem; font-weight: 900; margin-top: 5px; }
        
        /* TABELA */
        .ranking-container { flex-grow: 1; overflow-y: auto; }
        table { width: 100%; border-collapse: separate; border-spacing: 0 5px; }
        
        thead tr { position: sticky; top: 0; background: #000; z-index: 2; }
        
        th { 
            text-align: center; padding: 15px; color: var(--blue); 
            border-bottom: 4px solid var(--blue);
            font-size: 1.1rem; text-transform: uppercase;
        }
        
        td { 
            padding: 15px 10px; background: #111;
            border-bottom: 1px solid #222; 
            text-align: center; font-size: 1.8rem; 
        }
        
        .td-nome { text-align: left; padding-left: 20px; font-size: 1.8rem; color: #fff; }
        
        .progress-bg { background: #222; height: 12px; width: 100%; border-radius: 6px; }
        .progress-fill { height: 100%; border-radius: 6px; transition: width 1s ease-out; }

        /* RESPONSIVO */
        @media (max-width: 768px) {
            body { padding: 5px; }
            #btn-start { font-size: 1.5rem; padding: 20px; }
            .metas-header { grid-template-columns: 1fr 1fr; gap: 8px; }
            .meta-card { min-height: 80px; }
            .meta-card .valor { font-size: 1.5rem; }
            .meta-card:last-child { grid-column: span 2; border-color: var(--green); }
            th { font-size: 0.8rem; padding: 5px; }
            td { font-size: 1.1rem; padding: 10px 5px; }
            .td-nome { font-size: 1.1rem; padding-left: 10px; }
            .mobile-hide { display: none; }
            .nome-loja-vitoria { font-size: 3rem; border-width: 4px; padding: 20px; }
        }
    </style>
</head>
<body>

    <div id="overlay-start" onclick="document.getElementById('overlay-start').style.display='none'; tentarIniciar();">
        <button id="btn-start">INICIAR SISTEMA</button>
    </div>
    
    <div id="overlay-vitoria">
        <h1 class="text-white" style="font-size: 3rem; margin:0; letter-spacing: 5px;">META BATIDA!</h1>
        <div id="nome-loja-animacao" class="nome-loja-vitoria">LOJA</div>
    </div>

    <audio id="som-caixa" src="1.mp3"></audio>
    <audio id="som-corrida" src="2.mp3"></audio>
    <audio id="som-vitoria" src="3.mp3"></audio>

    <div class="metas-header">
        <div class="meta-card"><h3>Geral (Mês)</h3><span class="valor text-green" id="meta-geral">...</span></div>
        <div class="meta-card" style="border-color:#fff"><h3>Acumulado</h3><span class="valor text-white" id="acumulado-mes">...</span></div>
        <div class="meta-card mobile-hide"><h3>Quinzenal</h3><span class="valor text-blue" id="meta-quinzena">...</span></div>
        <div class="meta-card mobile-hide"><h3>Semanal</h3><span class="valor text-blue" id="meta-semana">...</span></div>
        <div class="meta-card" style="border-color:var(--green)"><h3>META HOJE</h3><span class="valor text-green" id="meta-diaria">...</span><small style="color:#fff; font-size:0.9rem; margin-top:5px" id="venda-hoje-total">...</small></div>
    </div>

    <div class="ranking-container">
        <table id="tabela-ranking">
            <thead>
                <tr>
                    <th width="8%">#</th>
                    <th width="28%" style="text-align:left; padding-left:20px">Loja</th>
                    <th class="mobile-hide" width="15%" style="color:var(--gold)">Meta</th>
                    <th width="18%" style="color:#fff">Acumulado</th>
                    <th width="18%">Hoje</th>
                    <th width="13%">%</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

<script>
    // ==========================================
    // COLE SUA URL AQUI:
    // ==========================================
    var WEB_APP_URL = "SUA_URL_AQUI"; 
    // ==========================================

    var lojasConfig = [
        { nome: "Prime Umuarama", meta: 60000 }, { nome: "Prime Toledo", meta: 30000 },
        { nome: "Umuarama 1", meta: 60000 }, { nome: "Palotina", meta: 50000 },
        { nome: "Umuarama 2", meta: 40000 }, { nome: "Douradina", meta: 40000 },
        { nome: "Altônia", meta: 40000 }, { nome: "Marechal", meta: 20000 },
        { nome: "Perobal", meta: 20000 }
    ];

    var rankingAnterior = [];
    var ultimoTotalMes = 0;
    var sistemaIniciado = false;
    var lojasBatida = [];

    function tentarIniciar() {
        sistemaIniciado = true;
        try {
            var audio = document.getElementById('som-caixa');
            audio.play().then(function() { audio.pause(); audio.currentTime = 0; }).catch(function(e) {});
        } catch(e) {}
        atualizar();
    }

    function tocar(id) {
        if (!sistemaIniciado) return;
        try { var audio = document.getElementById(id); if (audio) { audio.currentTime = 0; audio.play().catch(function(){}); } } catch(e) {}
    }

    function soltarConfetes() {
        if (typeof confetti === 'function') {
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 }, colors: ['#ffd700', '#00ffff', '#ff0000'], zIndex: 10001 });
            var duration = 15000;
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ffd700', '#00ffff', '#39ff14'], zIndex: 10001 });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ffd700', '#00ffff', '#39ff14'], zIndex: 10001 });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }
    }

    function animarVitoria(nome) {
        var overlay = document.getElementById('overlay-vitoria');
        document.getElementById('nome-loja-animacao').innerText = nome;
        overlay.style.display = 'flex';
        soltarConfetes(); 
        tocar('som-vitoria'); 
        setTimeout(function() { overlay.style.display = 'none'; }, 15000);
    }

    function fmt(v) { return v.toLocaleString('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:0}); }

    function getDiasRest() {
        var hoje = new Date(); var dia = hoje.getDate(); var ult = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate();
        if (dia >= ult) return 1;
        var uteis = Math.floor((ult - dia) * (24 / 28)); return uteis > 0 ? uteis : 1;
    }

    function atualizar() {
        if (!sistemaIniciado) return;

        fetch(WEB_APP_URL)
        .then(function(res) { return res.json(); })
        .then(function(dados) {
            var vendasHoje = dados.vendasHoje;
            var totalMes = parseFloat(dados.totalMes);
            var acumuladoLojas = dados.acumuladoPorLoja || {};

            var metaGeral = lojasConfig.reduce(function(a, b) { return a + b.meta; }, 0);
            document.getElementById('meta-geral').innerText = fmt(metaGeral);
            document.getElementById('acumulado-mes').innerText = fmt(totalMes);

            var saldo = metaGeral - totalMes; if (saldo < 0) saldo = 0;
            var dias = getDiasRest();
            var metaDiaGeral = saldo / dias;

            document.getElementById('meta-diaria').innerText = fmt(metaDiaGeral);
            document.getElementById('meta-quinzena').innerText = fmt(metaDiaGeral * 12);
            document.getElementById('meta-semana').innerText = fmt(metaDiaGeral * 6);

            var porLojaHoje = {}; var totalHoje = 0;
            lojasConfig.forEach(function(l) { porLojaHoje[l.nome] = 0; });
            vendasHoje.forEach(function(v) {
                if (porLojaHoje[v[0]] !== undefined) porLojaHoje[v[0]] += parseFloat(v[1]);
                totalHoje += parseFloat(v[1]);
            });
            document.getElementById('venda-hoje-total').innerText = fmt(totalHoje);

            if (ultimoTotalMes > 0 && totalMes > ultimoTotalMes) tocar('som-caixa');
            ultimoTotalMes = totalMes;

            var ranking = lojasConfig.map(function(l) {
                var ac = acumuladoLojas[l.nome] || 0;
                var sld = l.meta - ac; if (sld < 0) sld = 0;
                var md = sld / dias;
                var vh = porLojaHoje[l.nome];
                var pct = (md > 0) ? (vh / md) * 100 : (vh > 0 ? 100 : 0);
                
                return { nome: l.nome, metaMensal: l.meta, acumulado: ac, metaDia: md, vendido: vh, pct: pct, batida: sld <= 0 };
            }).sort(function(a, b) { return b.vendido - a.vendido; });

            ranking.forEach(function(l) {
                var bateuHoje = (l.vendido >= l.metaDia && l.metaDia > 0);
                var bateuMes = (l.batida && l.vendido > 0);
                
                if (bateuHoje || bateuMes) {
                    if (lojasBatida.indexOf(l.nome) === -1) {
                        animarVitoria(l.nome); 
                        lojasBatida.push(l.nome);
                    }
                }
            });

            if (rankingAnterior.length > 0) {
                var mudou = false;
                for (var i = 0; i < ranking.length; i++) { if (ranking[i].nome !== rankingAnterior[i]) mudou = true; }
                if (mudou) tocar('som-corrida');
            }
            rankingAnterior = ranking.map(function(r) { return r.nome; });

            var tbody = document.querySelector('tbody'); tbody.innerHTML = '';
            
            ranking.forEach(function(r, i) {
                var tr = document.createElement('tr');
                
                var corTexto = '#39ff14'; // Verde
                var corBarra = '#39ff14';
                
                if (r.batida) {
                    corTexto = '#ffd700'; // Ouro
                    corBarra = '#ffd700';
                } else if (r.vendido < (r.metaDia * 0.5)) {
                    corTexto = '#ff073a'; // Vermelho
                    corBarra = '#ff073a';
                }

                tr.innerHTML = 
                    '<td class="text-white">' + (i + 1) + 'º</td>' +
                    '<td class="td-nome">' + r.nome + '</td>' +
                    '<td class="mobile-hide" style="color:#ffd700">' + fmt(r.metaMensal) + '</td>' +
                    '<td style="color:#fff">' + fmt(r.acumulado) + '</td>' +
                    '<td style="color:' + corTexto + '">' + fmt(r.vendido) + '</td>' +
                    '<td><div class="progress-bg"><div class="progress-fill" style="width:' + Math.min(r.pct, 100) + '%; background:' + corBarra + '"></div></div>' + 
                    '<span style="color:' + corTexto + '">' + r.pct.toFixed(0) + '%</span></td>';
                
                tbody.appendChild(tr);
            });

        }).catch(function(e) { console.log(e); });
    }

    setInterval(atualizar, 5000);

</script>
</body>
</html>
