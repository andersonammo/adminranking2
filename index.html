<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STOCK MARKET RANKING</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23000000'/%3E%3Cpath d='M32 400 L160 250 L260 320 L480 80' stroke='%2300ff00' stroke-width='30' fill='none'/%3E%3C/svg%3E" type="image/svg+xml">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%23000000'/%3E%3Cpath d='M32 400 L160 250 L260 320 L480 80' stroke='%2300ff00' stroke-width='30' fill='none'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg: #000000;
            --stock-green: #00ff00; /* Verde Ticker Puro */
            --stock-red: #ff3333;   /* Vermelho Ticker Puro */
            --stock-blue: #00ccff;
            --stock-gold: #ffcc00;
            --text-gray: #666666;
            --border-color: #222222;
        }

        body { 
            background: var(--bg); 
            color: #ffffff; 
            font-family: 'Montserrat', sans-serif; 
            font-weight: 700; 
            margin: 0; padding: 10px; 
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
            -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
        }

        /* UTILITÁRIOS DE COR (SEM NEON) */
        .up { color: var(--stock-green); }
        .down { color: var(--stock-red); }
        .neutral { color: var(--stock-blue); }
        .gold { color: var(--stock-gold); }
        .muted { color: var(--text-gray); }

        /* TELA START */
        #overlay-start { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; z-index: 9999; 
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; 
        }
        #btn-start { 
            padding: 25px 50px; font-size: 2rem; 
            background: #000; color: var(--stock-green);
            border: 2px solid var(--stock-green); 
            font-family: 'Montserrat', sans-serif; font-weight: 900;
            text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; transition: 0.2s;
        }
        #btn-start:hover { background: var(--stock-green); color: #000; }

        /* TELA VITÓRIA - ESTILO "BREAKING NEWS" */
        #overlay-vitoria { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 10000; 
            flex-direction: column; align-items: center; justify-content: center; text-align: center; 
        }
        .nome-loja-vitoria { 
            font-size: 8rem; font-weight: 900; color: var(--stock-gold); text-transform: uppercase; 
            border-top: 5px solid var(--stock-gold); 
            border-bottom: 5px solid var(--stock-gold);
            padding: 20px 0; background: #000; width: 100%;
            margin-top: 30px; line-height: 1; letter-spacing: -2px;
        }

        /* HEADER - ESTILO TICKER */
        .metas-header { 
            display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; 
            margin-bottom: 10px; padding-bottom: 10px; 
            border-bottom: 1px solid var(--border-color); flex-shrink: 0; 
        }
        .meta-card { 
            background: #080808; padding: 10px; 
            text-align: right; /* Alinhamento financeiro */
            display: flex; flex-direction: column; justify-content: center; 
            min-height: 80px; border-left: 2px solid var(--border-color);
        }
        .meta-card h3 { margin: 0; font-size: 0.75rem; color: var(--text-gray); text-transform: uppercase; letter-spacing: 1px; text-align: left; }
        .meta-card .valor { font-size: 1.8rem; font-weight: 900; margin-top: 5px; letter-spacing: -1px; }
        
        /* TABELA - ESTILO DATA GRID */
        .ranking-container { flex-grow: 1; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; }
        
        thead tr { position: sticky; top: 0; background: #000; z-index: 2; border-bottom: 2px solid var(--text-gray); }
        
        th { 
            text-align: right; /* Cabeçalhos à direita */
            padding: 10px; color: var(--text-gray); 
            font-size: 0.9rem; text-transform: uppercase; font-weight: 700;
        }
        /* Primeira coluna alinhada à esquerda */
        th:first-child, td:first-child { text-align: left; }
        /* Coluna Loja alinhada à esquerda */
        th:nth-child(2), td:nth-child(2) { text-align: left; }

        td { 
            padding: 12px 10px; background: #000;
            border-bottom: 1px solid var(--border-color); 
            text-align: right; font-size: 1.4rem; letter-spacing: -0.5px;
        }
        
        .td-nome { font-weight: 900; font-size: 1.5rem; color: #fff; letter-spacing: 0px; }
        
        /* BARRAS RETAS (ESTILO GRÁFICO) */
        .progress-bg { background: #1a1a1a; height: 10px; width: 100%; margin-top: 5px; }
        .progress-fill { height: 100%; transition: width 1s ease-out; }

        /* RESPONSIVO */
        @media (max-width: 768px) {
            body { padding: 5px; }
            #btn-start { font-size: 1.5rem; padding: 20px; }
            .metas-header { grid-template-columns: 1fr 1fr; gap: 5px; }
            .meta-card { min-height: 70px; border: 1px solid #222; }
            .meta-card .valor { font-size: 1.4rem; }
            .meta-card:last-child { grid-column: span 2; border-bottom: 2px solid var(--stock-green); }
            
            th { font-size: 0.7rem; padding: 5px; }
            td { font-size: 1rem; padding: 8px 5px; }
            .td-nome { font-size: 1rem; }
            
            .mobile-hide { display: none; }
            .nome-loja-vitoria { font-size: 3rem; border: none; background: transparent; color: #fff; }
        }
    </style>
</head>
<body>

    <div id="overlay-start" onclick="document.getElementById('overlay-start').style.display='none'; tentarIniciar();">
        <button id="btn-start">ABRIR MERCADO</button>
    </div>
    
    <div id="overlay-vitoria">
        <h1 style="color:#fff; font-size: 2rem; margin:0; letter-spacing: 5px; text-transform:uppercase">Meta Batida</h1>
        <div id="nome-loja-animacao" class="nome-loja-vitoria">LOJA</div>
    </div>

    <audio id="som-caixa" src="1.mp3"></audio>
    <audio id="som-corrida" src="2.mp3"></audio>
    <audio id="som-vitoria" src="3.mp3"></audio>

    <div class="metas-header">
        <div class="meta-card"><h3>Meta Mês (Global)</h3><span class="valor up" id="meta-geral">...</span></div>
        <div class="meta-card"><h3>Realizado</h3><span class="valor" style="color:#fff" id="acumulado-mes">...</span></div>
        <div class="meta-card mobile-hide"><h3>Proj. Quinzena</h3><span class="valor neutral" id="meta-quinzena">...</span></div>
        <div class="meta-card mobile-hide"><h3>Proj. Semana</h3><span class="valor neutral" id="meta-semana">...</span></div>
        <div class="meta-card" style="border-left: 4px solid var(--stock-green)"><h3>Alvo Hoje (Global)</h3><span class="valor up" id="meta-diaria">...</span><small class="muted" style="margin-top:2px; font-size:0.7rem">VENDIDO HOJE: <span id="venda-hoje-total" style="color:#fff">...</span></small></div>
    </div>

    <div class="ranking-container">
        <table id="tabela-ranking">
            <thead>
                <tr>
                    <th width="5%">#</th>
                    <th width="25%">ATIVO (LOJA)</th>
                    <th class="mobile-hide" width="12%">MENSAL</th>
                    <th width="15%">ACUMULADO</th>
                    <th width="15%" style="color:#fff">META DIA</th> <th width="15%">HOJE</th>
                    <th width="13%">VAR(%)</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

<script>
    // ==========================================
    // COLE SUA URL AQUI:
    // ==========================================
    var WEB_APP_URL = "SUA_URL_AQUI"; 
    // ==========================================

    var lojasConfig = [
        { nome: "Prime Umuarama", meta: 60000 }, { nome: "Prime Toledo", meta: 30000 },
        { nome: "Umuarama 1", meta: 60000 }, { nome: "Palotina", meta: 50000 },
        { nome: "Umuarama 2", meta: 40000 }, { nome: "Douradina", meta: 40000 },
        { nome: "Altônia", meta: 40000 }, { nome: "Marechal", meta: 20000 },
        { nome: "Perobal", meta: 20000 }
    ];

    var rankingAnterior = [];
    var ultimoTotalMes = 0;
    var sistemaIniciado = false;
    var lojasBatida = [];

    function tentarIniciar() {
        sistemaIniciado = true;
        try {
            var audio = document.getElementById('som-caixa');
            audio.play().then(function() { audio.pause(); audio.currentTime = 0; }).catch(function(e) {});
        } catch(e) {}
        atualizar();
    }

    function tocar(id) {
        if (!sistemaIniciado) return;
        try { var audio = document.getElementById(id); if (audio) { audio.currentTime = 0; audio.play().catch(function(){}); } } catch(e) {}
    }

    function soltarConfetes() {
        if (typeof confetti === 'function') {
            confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 }, colors: ['#ffd700', '#ffffff', '#00ff00'], zIndex: 10001 });
            var duration = 15000;
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ffd700', '#ffffff'], zIndex: 10001 });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ffd700', '#ffffff'], zIndex: 10001 });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }
    }

    function animarVitoria(nome) {
        var overlay = document.getElementById('overlay-vitoria');
        document.getElementById('nome-loja-animacao').innerText = nome;
        overlay.style.display = 'flex';
        soltarConfetes(); 
        tocar('som-vitoria'); 
        setTimeout(function() { overlay.style.display = 'none'; }, 15000);
    }

    // Formatação financeira padrão (sem centavos para limpar)
    function fmt(v) { return v.toLocaleString('pt-BR', {style:'decimal', minimumFractionDigits: 2, maximumFractionDigits: 2}); }
    function fmtM(v) { return v.toLocaleString('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:0}); }

    function getDiasRest() {
        var hoje = new Date(); var dia = hoje.getDate(); var ult = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0).getDate();
        if (dia >= ult) return 1;
        var uteis = Math.floor((ult - dia) * (24 / 28)); return uteis > 0 ? uteis : 1;
    }

    function atualizar() {
        if (!sistemaIniciado) return;

        fetch(WEB_APP_URL)
        .then(function(res) { return res.json(); })
        .then(function(dados) {
            var vendasHoje = dados.vendasHoje;
            var totalMes = parseFloat(dados.totalMes);
            var acumuladoLojas = dados.acumuladoPorLoja || {};

            var metaGeral = lojasConfig.reduce(function(a, b) { return a + b.meta; }, 0);
            document.getElementById('meta-geral').innerText = fmtM(metaGeral);
            document.getElementById('acumulado-mes').innerText = fmtM(totalMes);

            var saldo = metaGeral - totalMes; if (saldo < 0) saldo = 0;
            var dias = getDiasRest();
            var metaDiaGeral = saldo / dias;

            document.getElementById('meta-diaria').innerText = fmtM(metaDiaGeral);
            document.getElementById('meta-quinzena').innerText = fmtM(metaDiaGeral * 12);
            document.getElementById('meta-semana').innerText = fmtM(metaDiaGeral * 6);

            var porLojaHoje = {}; var totalHoje = 0;
            lojasConfig.forEach(function(l) { porLojaHoje[l.nome] = 0; });
            vendasHoje.forEach(function(v) {
                if (porLojaHoje[v[0]] !== undefined) porLojaHoje[v[0]] += parseFloat(v[1]);
                totalHoje += parseFloat(v[1]);
            });
            document.getElementById('venda-hoje-total').innerText = fmtM(totalHoje);

            if (ultimoTotalMes > 0 && totalMes > ultimoTotalMes) tocar('som-caixa');
            ultimoTotalMes = totalMes;

            var ranking = lojasConfig.map(function(l) {
                var ac = acumuladoLojas[l.nome] || 0;
                var sld = l.meta - ac; if (sld < 0) sld = 0;
                
                // CÁLCULO DA META DIÁRIA INDIVIDUAL DA LOJA
                var md = sld / dias; 
                
                var vh = porLojaHoje[l.nome];
                var pct = (md > 0) ? (vh / md) * 100 : (vh > 0 ? 100 : 0);
                
                return { nome: l.nome, metaMensal: l.meta, acumulado: ac, metaDia: md, vendido: vh, pct: pct, batida: sld <= 0 };
            }).sort(function(a, b) { return b.vendido - a.vendido; });

            ranking.forEach(function(l) {
                var bateuHoje = (l.vendido >= l.metaDia && l.metaDia > 0);
                var bateuMes = (l.batida && l.vendido > 0);
                
                if (bateuHoje || bateuMes) {
                    if (lojasBatida.indexOf(l.nome) === -1) {
                        animarVitoria(l.nome); 
                        lojasBatida.push(l.nome);
                    }
                }
            });

            if (rankingAnterior.length > 0) {
                var mudou = false;
                for (var i = 0; i < ranking.length; i++) { if (ranking[i].nome !== rankingAnterior[i]) mudou = true; }
                if (mudou) tocar('som-corrida');
            }
            rankingAnterior = ranking.map(function(r) { return r.nome; });

            var tbody = document.querySelector('tbody'); tbody.innerHTML = '';
            
            ranking.forEach(function(r, i) {
                var tr = document.createElement('tr');
                
                // Cores de Ação (Bolsa de Valores)
                var corTexto = '#00ff00'; // Verde Ticker
                var corBarra = '#00ff00';
                
                if (r.batida) {
                    corTexto = '#ffcc00'; // Ouro
                    corBarra = '#ffcc00';
                } else if (r.vendido < (r.metaDia * 0.5)) {
                    corTexto = '#ff3333'; // Vermelho Ticker
                    corBarra = '#ff3333';
                }

                tr.innerHTML = 
                    '<td class="muted">' + (i + 1) + '</td>' +
                    '<td class="td-nome">' + r.nome + '</td>' +
                    '<td class="mobile-hide muted">' + fmt(r.metaMensal) + '</td>' +
                    '<td style="color:#fff">' + fmt(r.acumulado) + '</td>' +
                    
                    // NOVA COLUNA: META DIÁRIA INDIVIDUAL
                    '<td style="color:#fff; font-weight:bold">' + fmt(r.metaDia) + '</td>' +
                    
                    '<td style="color:' + corTexto + '">' + fmt(r.vendido) + '</td>' +
                    '<td><div class="progress-bg"><div class="progress-fill" style="width:' + Math.min(r.pct, 100) + '%; background:' + corBarra + '"></div></div>' + 
                    '<span style="color:' + corTexto + '; font-size:0.9rem">' + r.pct.toFixed(1) + '%</span></td>';
                
                tbody.appendChild(tr);
            });

        }).catch(function(e) { console.log(e); });
    }

    setInterval(atualizar, 5000);

</script>
</body>
</html>
