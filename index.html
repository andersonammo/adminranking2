<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RANKING BLINDADO</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" onerror="console.log('Confetes não carregaram (Sem internet?), ignorando.')"></script>

    <style>
        :root { --bg: #000; --text: #00ff00; --alert: #ff0000; --panel: #0a0a0a; --gold: #ffd700; }
        body { 
            background: var(--bg); color: var(--text); 
            font-family: 'Courier New', monospace; 
            margin: 0; padding: 10px; 
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* --- TELA START --- */
        #overlay-start { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        #btn-start { padding: 20px 40px; font-size: 2rem; background: #00ff00; border: none; font-weight: bold; cursor: pointer; animation: pulse 2s infinite; border-radius: 50px; box-shadow: 0 0 20px #00ff00; }
        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.05);} 100% {transform: scale(1);} }

        /* --- ANIMAÇÃO VITÓRIA --- */
        #overlay-vitoria { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); 
            z-index: 10000; flex-direction: column; align-items: center; justify-content: center; text-align: center; 
        }
        
        .nome-loja-vitoria { 
            font-size: 5rem; font-weight: bold; color: var(--gold); text-transform: uppercase; 
            animation: neon 0.8s infinite alternate, zoomEntrada 0.5s ease-out; 
            border: 4px solid var(--gold); padding: 30px; border-radius: 20px; 
            box-shadow: 0 0 50px var(--gold), inset 0 0 20px var(--gold);
            background: rgba(0,0,0,0.8);
            max-width: 90%; word-wrap: break-word;
        }
        
        .titulo-vitoria {
            font-size: 3rem; color: #fff; margin-bottom: 20px; letter-spacing: 5px; text-shadow: 0 0 10px #fff;
            animation: piscar 0.5s infinite;
        }

        @keyframes neon { from { text-shadow: 0 0 10px var(--gold); transform: scale(1); } to { text-shadow: 0 0 40px var(--gold), 0 0 80px var(--text); transform: scale(1.05); } }
        @keyframes zoomEntrada { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        @keyframes piscar { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* --- HEADER --- */
        .metas-header { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 10px; border-bottom: 2px solid var(--text); padding-bottom: 10px; flex-shrink: 0; }
        .meta-card { background: var(--panel); padding: 5px; border: 1px solid #333; text-align: center; display: flex; flex-direction: column; justify-content: center; min-height: 70px; }
        .meta-card h3 { margin: 0; font-size: 0.65rem; color: #888; text-transform: uppercase; }
        .meta-card .valor { font-size: 1.2rem; font-weight: bold; }
        .card-acumulado .valor { color: #fff; text-shadow: 0 0 5px #fff; }

        /* --- TABELA --- */
        .ranking-container { flex-grow: 1; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        thead tr { position: sticky; top: 0; background: #000; border-bottom: 2px solid var(--text); z-index: 2; }
        th { text-align: center; padding: 8px 4px; color: #888; text-transform: uppercase; border-right: 1px solid #222; font-size: 0.75rem; }
        td { padding: 8px 4px; border-bottom: 1px solid #222; border-right: 1px solid #222; text-align: center; font-weight: bold; font-size: 1.1rem; }
        .td-nome { text-align: left; padding-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
        .progress-bg { width: 100%; background: #333; height: 4px; margin-bottom: 2px; border-radius: 2px; }
        .progress-fill { height: 100%; transition: width 1s; border-radius: 2px; }

        /* --- RESPONSIVIDADE --- */
        @media (max-width: 768px) {
            body { padding: 5px; overflow: auto; }
            .metas-header { grid-template-columns: 1fr 1fr; }
            .meta-card:last-child { grid-column: span 2; border-color: #00ff00; }
            .nome-loja-vitoria { font-size: 2rem; padding: 15px; }
            .titulo-vitoria { font-size: 1.5rem; }
            .col-hide-mobile { display: none; }
            th, td { font-size: 0.8rem; padding: 5px 2px; }
            .td-nome { max-width: 90px; }
        }
    </style>
</head>

        <div class="meta-card"><h3>Semanal</h3><span class="valor" id="meta-semana">...</span></div>
        <div class="meta-card"><h3>META DIÁRIA HOJE</h3><span class="valor" id="meta-diaria">...</span><small style="color:#fff; font-size:0.7rem">HOJE: <span id="venda-hoje-total">...</span></small></div>
    </div>

    <div class="ranking-container">

            </thead>
            <tbody></tbody>
        </table>
    </div>

    // --- FUNÇÃO BLINDADA: Garante que a tela some mesmo com erro ---
    function iniciarSistema() {
        // 1. Esconde a tela imediatamente (Prioridade Total)
        document.getElementById('overlay-start').style.display = 'none';
        sistemaIniciado = true;
        
        // 2. Tenta tocar som, mas ignora se falhar
        try { 
            var audio = document.getElementById('som-caixa');
            audio.play().then(()=>{ audio.pause(); audio.currentTime=0; }).catch(e => console.log("Erro audio:", e));
        } catch(e){ console.log("Sem áudio inicial"); }

        // 3. Inicia o sistema
        atualizar();
    }
    
    function tocar(id) { 
        if(sistemaIniciado) { 
            var a = document.getElementById(id); 
            if(a){ a.currentTime=0; a.play().catch(()=>{}); } 
        } 
    }

    // --- FUNÇÃO DE EFEITOS SEGURA ---
    function dispararEfeitos() {
        // Só tenta rodar confetes se a biblioteca carregou
        if (typeof confetti === 'function') {
            try {
                var duration = 5 * 1000;
                var end = Date.now() + duration;

                confetti({ particleCount: 150, spread: 100, origin: { y: 0.3 }, colors: ['#ffd700', '#00ff00', '#ffffff'], zIndex: 10001 });

                (function frame() {
                    confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0, y: 0.8 }, colors: ['#ff0000', '#00ff00', '#ffd700'], zIndex: 10001 });
                    confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1, y: 0.8 }, colors: ['#ff0000', '#00ff00', '#ffd700'], zIndex: 10001 });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            } catch(e) { console.log("Erro ao animar confetes"); }
        } else {
            console.log("Biblioteca de confetes não carregou. Ignorando.");
        }
    }
